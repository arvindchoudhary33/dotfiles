set-option -g default-shell /usr/bin/fish

unbind C-b
set -g prefix C-Space
set -s set-clipboard on
bind C-Space send-prefix

# No delay for escape key in nvim
set -s escape-time 0

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Last window
bind -r ^ last-window

# Open TODO in nvim
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# Copy mode (vi)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Mouse support
set -g mouse on
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Terminal colors
set -ga terminal-overrides ",screen-256color*:Tc"
set -g default-terminal "screen-256color"

set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 60

# Show tmux session name in terminal title
set -g set-titles on
set -g set-titles-string "#S · #W"

# Theme colors (managed by apply-theme)
source-file ~/.config/theme/.current/tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set -g @resurrect-save-bash-history 'off'
run '~/.tmux/plugins/tpm/tpm'

