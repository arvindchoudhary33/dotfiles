onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

# Kanagawa Dragon: herdr only ships Wave/Lotus, so override the tokens
[theme.custom]
panel_bg = "#181616"
surface_dim = "#12120f"
surface0 = "#282727"
surface1 = "#393836"
overlay0 = "#625e5a"
overlay1 = "#737c73"
text = "#c5c9c5"
subtext0 = "#a6a69c"
active_row_bg = "#282727"
selection_bg = "#393836"
accent = "#a292a3"
mauve = "#a292a3"
green = "#87a987"
yellow = "#c4b28a"
red = "#c4746e"
blue = "#8ba4b0"
teal = "#8ea4a2"
peach = "#b6927b"

[ui]
# Outer terminal (kitty tab) title: just the workspace name, no hostname
window_title = "{workspace}"
pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

[keys]
# Prefix — same as tmux
prefix = "ctrl+space"

# Pane navigation — vim-style like tmux
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# Splits — prefix+v (right) and prefix+minus (down)
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"

# Tabs (windows in tmux terms)
new_tab      = "prefix+c"
next_tab     = "prefix+n"
switch_tab   = "prefix+1..9"

# Session/workspace
goto             = "prefix+s"
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
zoom             = "prefix+z"
close_pane       = "prefix+x"

# Copy mode — prefix+[ like tmux, vi keys inside
copy_mode = "prefix+["

# Detach
detach         = "prefix+d"
workspace_picker = "prefix+space"

# Reload config (like tmux's prefix+r)
[[keys.command]]
key         = "prefix+r"
type        = "shell"
command     = "herdr server reload-config"
description = "reload config"

[[keys.command]]
key         = "prefix+p"
type        = "plugin_action"
command     = "local.last-workspace.toggle"
description = "last workspace"
